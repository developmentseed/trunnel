[tool.uv]
managed = true
dev-dependencies = [
    "boto3-stubs[ec2,rds,resourcegroupstaggingapi]>=1.34.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "ty>=0.0.18",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "trunnel_cli",
    "trunnel_infra",
]
