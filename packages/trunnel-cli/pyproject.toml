[project]
name = "trunnel-cli"
version = "0.1.0"
description = "Automated SSM tunneling for RDS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
dependencies = [
    "boto3>=1.34.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
types = [
    "boto3-stubs[ec2,rds,resourcegroupstaggingapi]>=1.34.0",
]

[project.scripts]
trunnel = "trunnel_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trunnel_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
